name: CI

# Runs the test suite on every push and pull request so the PR page shows a
# pass/fail check. The OCR test uses the bundled tesseract language data
# (src/data/tessdata/) and the @napi-rs/canvas prebuilt binary, so no network
# access is needed at test time.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
